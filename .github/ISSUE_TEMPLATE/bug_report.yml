name: Bug report
description: Report a problem with the tools
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!

        These tools deal with undocumented, **version-specific** game data
        formats, so the exact client version is essential — please fill it in
        below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The exact command(s) you ran and what you did.
      placeholder: |
        1. Ran `EditorCLI pack unpack ...`
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include full error output / stack traces.
    validations:
      required: true

  - type: input
    id: game-version
    attributes:
      label: Game / client version
      description: >
        The Allods Online client version this concerns (e.g. 3.0.00.89). If you
        are not sure, provide whatever version information you have.
      placeholder: "3.0.00.89"
    validations:
      required: true

  - type: input
    id: tool-version
    attributes:
      label: Tool version / commit
      description: The release, tag, or commit hash you built from.
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / Ubuntu 24.04 / macOS 14"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### Need help with a specific version?

        If your issue is specific to a client version and the maintainers may
        need it to reproduce, please upload your client to
        [community.allods-developers.eu](https://community.allods-developers.eu/)
        and link it here. Version-specific issues are much harder to help with
        when nobody can access the client in question.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues for a duplicate.
          required: true
        - label: I have included the game/client version above.
          required: true
        - label: If I need help on an unsupported version, I have uploaded the client to [community.allods-developers.eu](https://community.allods-developers.eu/).
          required: true