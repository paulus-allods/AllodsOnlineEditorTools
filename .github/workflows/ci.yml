name: CI

on:
  push:
    branches: main
    paths-ignore:
      - '**.md'
      - 'doc/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'doc/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The solution references StructCodeGeneration, which is not part of the
      # open-source repository, so build the individual project files instead.
      - name: Restore
        run: |
          dotnet restore EditorCLI/EditorCLI.csproj
          dotnet restore ClientResources.Tests/ClientResources.Tests.csproj

      - name: Build
        run: |
          dotnet build EditorCLI/EditorCLI.csproj --configuration Release --no-restore
          dotnet build ClientResources.Tests/ClientResources.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test ClientResources.Tests/ClientResources.Tests.csproj --configuration Release --no-build --verbosity normal

  code-style:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ClientResources
            args: ClientResources/ClientResources.csproj --exclude ClientResources/Structs/
          - name: EditorCLI
            args: EditorCLI/EditorCLI.csproj
          - name: Tests
            args: ClientResources.Tests/ClientResources.Tests.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify formatting (${{ matrix.name }})
        run: dotnet format ${{ matrix.args }} --verify-no-changes
